{% extends 'base.html' %}

{% block title %}Club Points | GUDLFT{% endblock %}

{% block content %}

    <section>
        <table>
            <thead>
                <tr>
                    <th>Club</th>
                    <th>Points</th>
                </tr>
            </thead>
            <tbody>
                {% for club in clubs %}
                    <tr>
                        <td>{{ club['name'] }}</td>
                        <td>{{ club['points'] }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>

        <p>
            <a href="{{ url_for('index') }}">Back to home</a>
        </p>
    </section>

{% endblock %}
